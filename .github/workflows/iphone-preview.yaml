name: Build unsigned iPhone preview

# Manual only. No Apple credentials, signing, App Store or TestFlight upload.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Verify Apple SDK selection
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Verify automatic playback on an iPhone simulator
        run: |
          python3 tool/prepare_personal_ios.py
          flutter pub get
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,items in d["devices"].items() if "iOS" in k for v in items if v["name"].startswith("iPhone") and v.get("isAvailable",True)))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          flutter test integration_test/local_queue_transition_test.dart -d "$SIMULATOR_ID" --timeout 3m --dart-define=HOMESERVER_PERSONAL=true --dart-define=JELLYBOX_SIDELOAD=true
      - name: Prepare and build the personal app
        run: bash tool/build_homeserver_ios.sh
      - name: Package for free-account re-signing
        run: |
          mkdir -p build/unsigned/Payload
          ditto build/ios/iphoneos/Runner.app build/unsigned/Payload/Runner.app
          cd build/unsigned
          ditto -c -k --keepParent Payload HomeServer-Audio-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: HomeServer-Audio-unsigned-iPhone
          path: build/unsigned/HomeServer-Audio-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
